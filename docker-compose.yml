services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      DOCUMENT_STORAGE_PATH: /app/storage/documents
    volumes:
      - documents:/app/storage/documents
volumes:
  documents:
